name: Refresh Upstox Token

on:
  schedule:
    - cron: '20 3 * * 1-5'  # 8:50 AM IST (UTC+5:30), Mon–Fri
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install upstox-totp requests

      - name: Generate and store Upstox access token
        env:
          UPSTOX_USERNAME: ${{ secrets.UPSTOX_USERNAME }}
          UPSTOX_PIN_CODE: ${{ secrets.UPSTOX_PIN_CODE }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          TOKEN_STORE_URL: ${{ secrets.VERCEL_APP_URL }}/api/cron/store-token
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/refresh_token.py
