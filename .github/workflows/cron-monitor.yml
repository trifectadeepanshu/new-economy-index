name: Cron Monitor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cron-monitor.yml"
  schedule:
    # Vercel starts the snapshot at 11:00 UTC. Check later and retry because
    # neither Vercel nor GitHub guarantees exact scheduled execution times.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  cron-run-recorded:
    name: Confirm snapshot cron recorded
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://new-economy-index.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check cron health
        run: |
          node <<'NODE'
          const siteUrl = process.env.SITE_URL?.replace(/\/+$/, "");
          const secret = process.env.CRON_SECRET;
          if (!siteUrl) throw new Error("SITE_URL is not set");
          if (!secret) throw new Error("CRON_SECRET is not set");

          const attempts = 6;
          const delayMs = 10 * 60 * 1000;
          let lastError = "Cron health check failed";
          class FatalMonitorError extends Error {}

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const response = await fetch(`${siteUrl}/api/cron/status`, {
                headers: { Authorization: `Bearer ${secret}` },
              });
              const payload = await response.json().catch(() => ({}));
              if (response.ok && payload.ok) {
                const rows = payload.snapshot?.stockRows ?? 0;
                console.log(
                  `Snapshot cron recorded cleanly for ${payload.expectedSnapshotDate}: ${rows} rows.`
                );
                if (payload.expectedRefreshDate) {
                  console.log(`Quarterly refresh recorded cleanly for ${payload.expectedRefreshDate}.`);
                }
                process.exit(0);
              }

              const details = Array.isArray(payload.issues)
                ? payload.issues.map((item) => item.message).join("; ")
                : payload.error ?? `HTTP ${response.status}`;
              lastError = details;

              if (response.status === 401 || payload.retryable === false) {
                throw new FatalMonitorError(details);
              }
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
              if (error instanceof FatalMonitorError) throw error;
            }

            if (attempt < attempts) {
              console.warn(`Attempt ${attempt}/${attempts} failed: ${lastError}. Retrying in 10 minutes.`);
              await new Promise((resolve) => setTimeout(resolve, delayMs));
            }
          }

          throw new Error(lastError);
          NODE
